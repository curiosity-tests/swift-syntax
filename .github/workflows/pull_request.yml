name: Pull request

permissions:
  contents: read
  id-token: write

# PRs created by GitHub Actions don't kick off further actions (https://github.com/peter-evans/create-pull-request/blob/d57e551ebc1a16dee0b8c9ea6d24dba7627a6e35/docs/concepts-guidelines.md#triggering-further-workflow-runs).
# As a workaround, we mark automerge PRs that are created by GitHub actions as draft and trigger the GitHub actions by marking the PR as ready for review. We'd prefer not re-triggering testing on a normal user's PR in this case, but skipping them causes the checks to reset.
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "Pull request ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      enable_wasm_sdk_build: true
      wasm_sdk_build_command: "swift test -c release --explicit-target-dependency-import-check error --toolset Toolsets/wasi-test-toolset.json"
      linux_build_command: "swift test --explicit-target-dependency-import-check error"
      windows_build_command: "Invoke-Program swift test --explicit-target-dependency-import-check error"
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.15
    with:
      api_breakage_check_enabled: false  # https://github.com/swiftlang/swift-syntax/issues/3010
      docs_check_additional_arguments: "--disable-parameters-and-returns-validation"
  bazel_build:
    name: Bazel Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Update environment
        run: |
          echo "/usr/share/swift/usr/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV
      - name: Build with Bazel
        run: bazel build //...

  verify_source_code:
    name: Validate generated code
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
          elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
          elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
          elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
          elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
          fi

      - name: Checkout repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Validate generated code
        run: "./swift-syntax-dev-utils verify-source-code --toolchain /usr"
  test_using_swift_syntax_dev_utils_linux:
    name: Run tests using swift-syntax-dev-utils (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
          elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
          elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
          elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
          elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
          fi

      - name: Checkout repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Test
        run: "./swift-syntax-dev-utils test --enable-rawsyntax-validation --enable-test-fuzzing --toolchain /usr"
